version: "3.8"

services:
    db:
        image: postgres:latest
        container_name: go_analytics_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: go_analytics
        ports:
            - "5433:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
            - ./internal/database:/docker-entrypoint-initdb.d

volumes:
    db_data:
